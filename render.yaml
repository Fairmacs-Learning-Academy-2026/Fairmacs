# Render Blueprint: one repo, two services (backend API + frontend static site).
# Values marked "sync: false" are asked for in the Render dashboard and are never stored in Git.
services:
  - type: web
    name: fairmacs-lms-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free            # use "starter" or higher so scheduled jobs keep running (free sleeps after ~15 min idle)
    envVars:
      - key: SUPABASE_DB_URL
        sync: false       # jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
      - key: SUPABASE_DB_USERNAME
        sync: false       # postgres.<project-ref>
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true   # random 256-bit value, created once and then kept stable
      - key: FLYWAY_BASELINE_ON_MIGRATE
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        sync: false       # https://<your-frontend>.onrender.com
      - key: FRONTEND_BASE_URL
        sync: false       # https://<your-frontend>.onrender.com
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: ZOHO_REDIRECT_URI
        sync: false       # https://<your-backend>.onrender.com/api/integrations/zoho/callback

  - type: web
    name: fairmacs-lms-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        sync: false       # https://<your-backend>.onrender.com/api
    routes:
      - type: rewrite     # React Router (BrowserRouter): every path must serve index.html
        source: /*
        destination: /index.html
