# Server Configuration
server.port=8080
spring.application.name=fairmacs-lms

# Zoho WorkDrive Integration
zoho.client-id=${ZOHO_CLIENT_ID}
zoho.client-secret=${ZOHO_CLIENT_SECRET}
zoho.redirect-uri=${ZOHO_REDIRECT_URI:http://localhost:8080/api/integrations/zoho/callback}
zoho.accounts-url=https://accounts.zoho.com
zoho.api-base-url=https://www.zohoapis.com/workdrive
zoho.download-base-url=https://download.zoho.com

# Zoho WorkDrive
zoho.course-documents-folder-id=uqi2q368e8c06e5bc44de87954550476aa546


# Supabase PostgreSQL Configuration
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Optional local properties for development (gitignored)
spring.config.import=optional:classpath:application-local.properties

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.com.fairmacs.lms=DEBUG
logging.level.org.hibernate.engine.jdbc.env.internal.JdbcEnvironmentInitiator=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.authorization=TRACE